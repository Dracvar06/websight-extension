<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Student Handbook - Westfield College</title></head>
<body><main><h1>Student Handbook</h1>
<script>
const words = 'The college values honesty, curiosity and community. Students are expected to read this handbook in full. ';
const sections = ['Welcome','Conduct','Housing','Dining','Libraries','Health','Advising','Clubs','Athletics','Transport','Technology','Safety','Arts','Careers','Alumni'];
for (const s of sections) document.write('<h2>' + s + '</h2><p>' + words.repeat(14) + '</p>');
document.write('<h2>Parking</h2><p>A student parking permit costs $214 per quarter and is sold at the Transportation Office in Building 9.</p>');
for (const s of ['Glossary','Index']) document.write('<h2>' + s + '</h2><p>' + words.repeat(14) + '</p>');
</script></main></body></html>
